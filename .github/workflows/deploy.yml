name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  deploy-fetch:
    name: Deploy Fetch Function
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd fetch
          mkdir package
          pip install boto3 --target ./package
          cp fetch_hackernews.py ./package/

      - name: Zip function
        run: |
          cd fetch/package
          zip -r ../fetch_function.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::360934290883:role/github-actions-hackernews-pipeline-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name hackernews-fetch \
            --zip-file fileb://fetch/fetch_function.zip \
            --region eu-west-2

  deploy-process:
    name: Deploy Process Function
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd process
          mkdir package
          pip install boto3 --target ./package
          cp process_hackernews.py ./package/

      - name: Zip function
        run: |
          cd process/package
          zip -r ../process_function.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::360934290883:role/github-actions-hackernews-pipeline-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name hackernews-process \
            --zip-file fileb://process/process_function.zip \
            --region eu-west-2